services:
  - type: web
    name: abota-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abota-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: abota-postgres
    databaseName: abota
    user: abota
