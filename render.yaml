services:
  - type: web
    name: abota-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abota-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: abota-pwa
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
databases:
  - name: abota-postgres
    databaseName: abota
    user: abota
    region: frankfurt
    plan: free
